<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A personal productivity dashboard: focus timer, to-do list, clock, and quick links." />
  <title>Daymark | Personal Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- =====================================================
       DASHBOARD GRID
       ===================================================== -->
  <main class="dashboard" role="main">

    <!-- ── GREETING ── -->
    <section class="card greeting-card" aria-label="Greeting and clock">
      <div class="greeting-left">
        <h1 id="greeting-text">Good Morning ☀️</h1>
        <p class="subtitle" id="greeting-subtitle">Ready to crush it today?</p>
      </div>
      <div class="greeting-right" aria-live="polite" aria-atomic="true">
        <div class="clock" id="clock" aria-label="Current time">00:00:00 AM</div>
        <div class="date-display" id="date-display">Loading date...</div>
      </div>
    </section>

    <!-- ── FOCUS TIMER ── -->
    <section class="card timer-card" aria-label="Focus timer">
      <p class="card-title">⏱ Focus Timer</p>

      <div class="timer-ring-wrapper">
        <div class="timer-svg-group">
          <svg width="200" height="200" viewBox="0 0 200 200" aria-hidden="true">
            <circle class="timer-ring-bg"       cx="100" cy="100" r="80" />
            <circle class="timer-ring-progress" cx="100" cy="100" r="80"
                    id="timer-progress" />
          </svg>
          <span class="timer-time"   id="timer-time"   aria-live="polite">25:00</span>
          <span class="timer-status" id="timer-status" aria-live="polite">READY</span>
        </div>
      </div>

      <div class="timer-controls">
        <button class="btn btn-primary"   id="timer-start" aria-label="Start timer">▶ Start</button>
        <button class="btn btn-secondary" id="timer-stop"  aria-label="Pause timer">⏸ Pause</button>
        <button class="btn btn-secondary" id="timer-reset" aria-label="Reset timer">↺ Reset</button>
      </div>
    </section>

    <!-- ── TO-DO LIST ── -->
    <section class="card todo-card" aria-label="To-do list">
      <p class="card-title">✅ To-Do List</p>

      <div class="todo-input-row">
        <input
          type="text"
          id="todo-input"
          placeholder="Add a new task…"
          maxlength="120"
          aria-label="New task"
        />
        <button class="btn btn-primary" id="todo-add-btn" aria-label="Add task">+ Add</button>
      </div>

      <div class="todo-filters" role="group" aria-label="Filter tasks">
        <button class="filter-btn active" data-filter="all"    aria-pressed="true">All</button>
        <button class="filter-btn"        data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-btn"        data-filter="done"   aria-pressed="false">Done</button>
      </div>

      <ul id="todo-list" class="todo-list" aria-label="Task list" aria-live="polite"></ul>

      <p class="todo-summary" id="todo-summary" aria-live="polite"></p>
    </section>

    <!-- ── QUICK LINKS ── -->
    <section class="card links-card" aria-label="Quick links">
      <div class="links-header">
        <p class="card-title">🔗 Quick Links</p>
        <button class="btn btn-primary" id="add-link-btn" aria-label="Add quick link">+ Add Link</button>
      </div>
      <div id="links-grid" class="links-grid" aria-label="Saved links"></div>
    </section>

  </main>

  <!-- =====================================================
       ADD LINK MODAL
       ===================================================== -->
  <div id="link-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <h2 id="modal-title">Add Quick Link</h2>

      <label for="link-name-input">Name</label>
      <input id="link-name-input" type="text" placeholder="e.g. Google" maxlength="40" />

      <label for="link-url-input">URL</label>
      <input id="link-url-input" type="url" placeholder="e.g. https://google.com" maxlength="200" />

      <div class="modal-actions">
        <button class="btn btn-secondary" id="link-modal-cancel">Cancel</button>
        <button class="btn btn-primary"   id="link-modal-save">Save</button>
      </div>
    </div>
  </div>

  <!-- =====================================================
       TOAST CONTAINER
       ===================================================== -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="js/app.js"></script>
</body>
</html>
